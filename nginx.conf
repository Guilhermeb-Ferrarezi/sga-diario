server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve static assets with long cache
    location /diario-vava/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: any /diario-vava/* path serves the app
    location /diario-vava/ {
        try_files $uri $uri/ /diario-vava/index.html;
    }

    # Redirect bare root to the app
    location = / {
        return 301 /diario-vava/;
    }
}
